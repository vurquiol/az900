@if (visible) {
  <div class="modal-overlay" tabindex="-1" (click)="onOverlayClick($event)" (keydown.escape)="onCancel()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal__header">
        <h3 class="modal__title">{{ title }}</h3>
      </div>
      <div class="modal__body">
        <p class="modal__message">{{ message }}</p>
      </div>
      <div class="modal__footer">
        <button class="btn btn--outline" (click)="onCancel()">{{ cancelLabel }}</button>
        <button class="btn btn--primary" (click)="onConfirm()">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
}
